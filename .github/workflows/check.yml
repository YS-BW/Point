name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: offline suite (node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/pi-durable-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/pi-durable-validation/package-lock.json
      - name: install (locked)
        run: npm ci --ignore-scripts
      - name: syntax check
        run: npm run check
      - name: offline suite (1 crash round)
        run: POINT_CRASH_ROUNDS=1 npm test

  foundation:
    name: server foundation (node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  secret-scan:
    name: credential scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: fail on committed API keys
        run: |
          set -euo pipefail
          if git grep -nIE '(sk-[A-Za-z0-9]{24,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!**/package-lock.json'; then
            echo "::error::possible credential committed; remove it and rotate"
            exit 1
          fi
          echo "no credential-looking strings"
