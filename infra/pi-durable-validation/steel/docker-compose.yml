services:
  steel-webrtc:
    image: ${STEEL_IMAGE:-ccr.ccs.tencentyun.com/ys-bw-steel/steel-browser-webrtc@sha256:ceb049f65e14cc7a8d364139646350db92c4256ea720f6bf359f4ba5c0f88b6b}
    container_name: steel-webrtc
    shm_size: 512m
    mem_limit: 2g
    cpus: 3
    ports:
      - '127.0.0.1:3000:3000'
      - '127.0.0.1:3001:3001'
      - '127.0.0.1:9323:9223'
      - '127.0.0.1:10000-10010:10000-10010/udp'
    environment:
      NODE_ENV: production
      CHROME_HEADLESS: 'false'
      DOMAIN: 127.0.0.1:3000
      CDP_DOMAIN: 127.0.0.1:9323
      EXTERNAL_IP: 127.0.0.1
      ICE_SERVERS_JSON: '[]'
    tmpfs:
      - /recordings:size=256m
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:3000/v1/health >/dev/null && curl -fsS http://127.0.0.1:3001/sessions/debug >/dev/null
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
